<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICO AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f1117">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="nico-api-url" content="https://nicotest-1.onrender.com">
    <meta name="supabase-url" content="https://azsdhrotjzfqhnbfnohz.supabase.co">
    <meta name="supabase-anon-key" content="sb_publishable_4dbScBcCdNfUBwPKQSm5QQ_xUK--1vK">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="app-layout">
    <!-- Mobile Sidebar Overlay Backdrop -->
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <!-- Glass Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="sparkle" id="mascotLogo">❖</span> <span id="brandName">NICO</span>
            </div>
        </div>

        <button class="new-chat-btn">
            <span>+</span> New chat
        </button>

        <div class="sidebar-section">
            <p class="section-title">Recents</p>
            <div class="history-list" id="historyList"></div>
            <div id="recent-chats"></div>
        </div>

        <div class="sidebar-footer">
            <div class="user-profile-row">
                <div class="user-profile">
                    <div class="avatar" id="user-avatar">?</div>
                    <div class="user-info">
                        <span class="user-name" id="user-name">Not signed in</span>
                        <span class="status-online" id="user-status">Sign in to save chats</span>
                    </div>
                </div>
                <button id="settingsBtn" class="settings-btn" type="button" aria-label="Open settings" aria-expanded="false" aria-controls="settingsPanel" title="Settings">⚙</button>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <header class="top-header">
            <button class="mobile-menu-btn" id="menu-toggle" type="button" aria-label="Toggle menu" aria-controls="sidebar" aria-expanded="false">☰</button>
            <button id="exportBtn" class="export-btn" onclick="exportChat()" title="Export Chat History">
                ⬇ Export Chat
            </button>
            <span class="model-badge">Nico v2 • System OS</span>
        </header>

        <section class="settings-panel" id="settingsPanel" aria-hidden="true">
            <div class="settings-panel-header">
                <div>
                    <strong>Nico settings</strong>
                    <span>Personalize your workspace</span>
                </div>
                <button id="closeSettingsBtn" class="settings-close" type="button" aria-label="Close settings">×</button>
            </div>
            <div class="settings-scroll">
                <label class="setting-row">Personality &amp; tone
                    <select id="personalitySetting">
                        <option value="professional">Professional</option>
                        <option value="casual">Casual</option>
                        <option value="hype">Hype</option>
                        <option value="mica">Mica / Nurturing</option>
                    </select>
                </label>
                <label class="setting-row">Response length
                    <select id="lengthSetting">
                        <option value="short">Short and direct</option>
                        <option value="detailed">Detailed explanations</option>
                    </select>
                </label>
                <label class="setting-row">Theme
                    <select id="themeSetting">
                        <option value="midnight">Midnight blue</option>
                        <option value="cyberpunk">Cyberpunk neon</option>
                        <option value="sunset">Sunset orange</option>
                    </select>
                </label>
                <label class="setting-row">Appearance
                    <select id="modeSetting">
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                    </select>
                </label>
                <label class="setting-row">Font
                    <select id="fontSetting">
                        <option value="sans">Clean sans-serif</option>
                        <option value="mono">Monospace</option>
                    </select>
                </label>
                <label class="setting-row">Text size
                    <input id="fontSizeSetting" type="range" min="90" max="120" step="5" value="100">
                </label>
                <label class="setting-row">Model
                    <select id="modelSetting">
                        <option value="light">Lightweight / fast</option>
                        <option value="heavy">Heavy / complex coding</option>
                    </select>
                </label>
                <label class="setting-toggle"><span>Custom memory</span><input id="memorySetting" type="checkbox" checked></label>
                <textarea id="memoryInput" class="memory-input" rows="2" placeholder="Facts Nico should remember about you"></textarea>
                <label class="setting-toggle"><span>Use chat context</span><input id="contextSetting" type="checkbox" checked></label>
                <label class="setting-toggle"><span>Sound effects</span><input id="soundSetting" type="checkbox"></label>
                <label class="setting-row">Mascot
                    <select id="avatarSetting">
                        <option value="✦">Spark</option>
                        <option value="◈">Prism</option>
                        <option value="✧">Star</option>
                        <option value="●">Orb</option>
                    </select>
                </label>
                <div class="mascot-preview" id="mascotPreview" aria-live="polite">✦ <span>Current mascot</span></div>
                <div class="settings-auth-actions">
                    <button class="auth-btn" id="sign-in-btn" type="button">Sign in with Google</button>
                    <button class="auth-btn" id="sign-out-btn" type="button" hidden>Sign out</button>
                </div>
                <div class="settings-actions">
                    <button id="exportMarkdownBtn" type="button">Export Markdown</button>
                    <button id="exportJsonBtn" type="button">Export JSON</button>
                    <button id="clearContextBtn" type="button">Clear short-term context</button>
                </div>
            </div>
        </section>

        <div class="chat-container">
            <!-- Gemini-style Welcome Screen -->
            <div id="welcomeScreen" class="welcome-container">
                <h1 class="welcome-title">Hello, <span id="welcomeName">User</span></h1>
                <p class="welcome-subtitle">What should we focus on?</p>
            </div>
            
            <div class="chat-box" id="chatBox">
                <div id="typingIndicator" class="message assistant typing" style="display: none;">Nico is thinking...</div>
            </div>
        </div>

        <!-- Floating Glass Input Bar -->
        <div class="input-wrapper">
            <div class="input-pill">
                <button id="addBtn" class="icon-btn add-btn" type="button" aria-label="Open tools" aria-expanded="false" aria-controls="addFilesDropdown" title="Open tools">+</button>
                <input type="text" id="userInput" placeholder="Ask Nico...">
                <div class="input-actions">
                    <button id="micBtn" class="icon-btn" type="button" title="Voice Input">🎤</button>
                    <button id="sendBtn" class="send-btn" type="button">Send</button>
                </div>
            </div>

            <div class="attachment-list" id="attachmentList" aria-live="polite"></div>

            <div class="add-files-dropdown" id="addFilesDropdown" aria-hidden="true">
                <button class="dropdown-item" id="addFilesBtn" type="button">
                    <span class="dropdown-icon">📄</span>
                    <span>Add Files</span>
                </button>
                <button class="dropdown-item" id="addImagesBtn" type="button">
                    <span class="dropdown-icon">🖼️</span>
                    <span>Add Images</span>
                </button>
                <button class="dropdown-item" id="addCodeBtn" type="button">
                    <span class="dropdown-icon">⌨️</span>
                    <span>Add Code</span>
                </button>
            </div>
            <input id="filePicker" class="visually-hidden" type="file" multiple aria-hidden="true" tabindex="-1">
            <input id="imagePicker" class="visually-hidden" type="file" accept="image/*" multiple aria-hidden="true" tabindex="-1">
            <input id="codePicker" class="visually-hidden" type="file" accept=".c,.cpp,.css,.html,.java,.js,.json,.jsx,.md,.py,.sql,.ts,.tsx,.txt,.xml,.yaml,.yml,text/*" multiple aria-hidden="true" tabindex="-1">
            <p class="disclaimer">Nico OS may display inaccurate info. Verify system actions.</p>
        </div>
    </main>
</div>

<script src="script.js"></script>
<script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
    }
</script>

</body>
</html>

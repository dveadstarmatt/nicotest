services:
  - type: web
    name: nico-backend
    runtime: python
    buildCommand: python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
    startCommand: .venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

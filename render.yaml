services:
  - type: web
    name: nico-backend
    runtime: python
    pythonVersion: 3.11
    buildCommand: python3 -m pip install --upgrade pip && python3 -m pip install -r requirements.txt
    startCommand: python3 -m gunicorn -w 2 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-3.1-flash-lite

  # Static frontend. Do not use Python/gunicorn for this URL.
  - type: web
    name: nico-ai
    runtime: static
    buildCommand: mkdir -p public && cp index.html style.css script.js manifest.json sw.js icon.svg public/
    staticPublishPath: ./public
